plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
repositories {     mavenCentral()
    maven { url = 'https://maven.maxhenkel.de/repository/public'; content { includeGroup 'de.maxhenkel.voicechat' } }
    ivy { url = 'https://github.com/DivByDiamond/OC2R/releases/download'
        patternLayout { artifact 'v[revision]/[artifact]-[revision](-[classifier]).[ext]' }
        metadataSources { artifact() }; content { includeGroup 'li.cil.oc2' }
    } }

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

dependencies {
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.5.31'
    compileOnly 'li.cil.oc2:oc2r-1.21.1-neoforge:0.1.0:api@jar'
    testImplementation 'de.maxhenkel.voicechat:voicechat-api:2.5.31' 
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
jar {
    from('third_party') { into 'META-INF/third_party' }
    from('LICENSE') { into 'META-INF' }
}

// Opt-in rendered client smoke test; never bundled in runtime JARs.
if (providers.gradleProperty('edenUiTest').isPresent()) {
 def ui=sourceSets.create('uiTest');ui.compileClasspath+=sourceSets.main.compileClasspath+sourceSets.main.output
 ui.runtimeClasspath+=sourceSets.main.runtimeClasspath+ui.output;neoForge.mods.eden.sourceSet(ui)
 neoForge.runs.client.systemProperty('eden.uiOutput',file('../ui-captures').absolutePath)
 neoForge.runs.client.programArguments.addAll(['--width','1280','--height','900'])
}
